<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — FindA.Sale</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111827;
        color: #f3f4f6;
      }
    }

    .container {
      max-width: 500px;
      text-align: center;
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      margin-bottom: 32px;
    }

    .pin-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto;
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1f2937;
    }

    @media (prefers-color-scheme: dark) {
      h1 {
        color: #f3f4f6;
      }
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 24px;
    }

    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #d1d5db;
      }
    }

    .offline-message {
      background-color: #f9fafb;
      border-left: 4px solid #f97316;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 32px;
      text-align: left;
      font-size: 14px;
      color: #374151;
    }

    @media (prefers-color-scheme: dark) {
      .offline-message {
        background-color: #1f2937;
        color: #e5e7eb;
      }
    }

    .btn {
      display: inline-block;
      background-color: #f97316;
      color: #ffffff;
      padding: 12px 32px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #ea580c;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:focus {
      outline: 2px solid #f97316;
      outline-offset: 2px;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #9ca3af;
    }

    @media (prefers-color-scheme: dark) {
      .footer {
        color: #6b7280;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg class="pin-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Pin location marker -->
        <path d="M32 4c-8 0-14 6-14 14 0 12 14 30 14 30s14-18 14-30c0-8-6-14-14-14z" />
        <!-- Center dot (star) -->
        <circle cx="32" cy="18" r="3" fill="#f97316" />
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p class="subtitle">
      FindA.Sale requires an internet connection to continue.
    </p>

    <div class="offline-message">
      <strong>What to do:</strong>
      <ul style="margin-top: 8px; margin-left: 20px;">
        <li>Check your internet connection</li>
        <li>Turn on Wi-Fi or mobile data</li>
        <li>Try again when you're back online</li>
      </ul>
    </div>

    <button class="btn" onclick="window.location.reload()">Try Again</button>

    <div class="footer">
      <p>&copy; 2026 FindA.Sale. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
