name: Scrape Missouri Pawnbroker Licenses (Phase 2)

on:
  # DISABLED: Missouri pawnbrokers are licensed at the local/county level only (RSMo §§367.011–367.060).
  # No statewide registry exists — confirmed via finance.mo.gov. No data to collect.
  workflow_dispatch:

jobs:
  scrape:
    name: Missouri Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database
      - name: Run Missouri Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runMissouriPhase2Scraper } from "./src/services/scraper/sources/missouriPhase2Scraper";
            (async () => { try {
              await runMissouriPhase2Scraper();
              console.log("Missouri Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Missouri Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '