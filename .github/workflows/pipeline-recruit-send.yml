name: Pipeline — Recruit Send
on:
  schedule:
    - cron: '0 14-21 * * 1-5'   # hourly 14:00-21:00 UTC weekdays; job no-ops unless RECRUIT_SEND_ENABLED=true
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger recruit-send job
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"job":"recruit-send"}' \
            "${RAILWAY_BACKEND_URL}/api/internal/jobs/run" \
            --fail-with-body --connect-timeout 10 --max-time 60
