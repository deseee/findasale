name: Scrape Nebraska Pawnbroker Licenses (Phase 2)

on:
  schedule:
    # Monday 09:15 UTC
    - cron: '15 9 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Nebraska Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nebraska Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runNebraskaPhase2Scraper } from "./src/services/scraper/sources/nebraskaPhase2Scraper";
            try {
              await runNebraskaPhase2Scraper();
              console.log("Nebraska Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Nebraska Phase 2 scraper failed:", err);
              process.exit(1);
            }
          '

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Nebraska Phase 2 pawnbroker scraper failed. Check workflow run for details.'
            });
