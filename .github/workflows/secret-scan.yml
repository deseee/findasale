# secret-scan.yml — CI backstop for hardcoded secrets (repo is PUBLIC).
#
# Purpose: gitleaks scans commits for credentials that slipped past the local
# guards (.githooks/pre-commit and push.ps1). On push it scans the pushed diff;
# on pull_request it scans the full range of the PR. Any finding fails the run.
# This is the last line of defense before a secret reaches the public git history.
#
# Auth: uses the auto-provisioned GITHUB_TOKEN only (no license needed —
# deseee/findasale is a personal account, not an organization).

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # allows gitleaks to comment findings on PRs

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 -> full history, so PR scans cover every commit in the range.
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
