name: Scrape Michigan Pawnbroker Licenses (Phase 2)

on:
  schedule:
    # Monday 08:15 UTC
    - cron: '15 8 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Michigan Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database
      - name: Run Michigan Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runMichiganPhase2Scraper } from "./src/services/scraper/sources/michiganPhase2Scraper";
            (async () => { try {
              await runMichiganPhase2Scraper();
              console.log("Michigan Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Michigan Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '