name: Scrape Wisconsin Pawnbroker & Auctioneer Licenses (Phase 2)

on:
  schedule:
    # Monday 1:15 PM UTC
    - cron: '15 13 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Wisconsin Phase 2 Secondary Sale Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run Wisconsin Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runWisconsinPhase2Scraper } from "./src/services/scraper/sources/wisconsinPhase2Scraper";
            (async () => { try {
              await runWisconsinPhase2Scraper();
              console.log("Wisconsin Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Wisconsin Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
