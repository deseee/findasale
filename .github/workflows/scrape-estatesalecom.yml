name: Scrape EstateSale.com

on:
  schedule:
    # Quarterly — first Sunday of March, June, September, December at 6:00 AM UTC
    # Fixed 2026-07-26: day-of-month '1-7' + day-of-week '0' were both
    # restricted, which POSIX/GitHub Actions cron treats as OR'd (fires if
    # EITHER matches), not AND'd -- this was firing every Sunday within the
    # trigger months instead of only the first, then going fully silent in
    # every other month (confirmed via 3 real runs: 2026-06-14/21/28, none
    # of which is June's actual first Sunday, 06-07). Fix: unrestrict day-of-
    # month here and gate the real "first Sunday" check in the step below.
    - cron: '0 6 * 3,6,9,12 0'   # Every Sunday in Mar/Jun/Sep/Dec; step below skips all but the first
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5-hour cap — phase 1 (51 state pages) + phase 2 (profile visits at 10s each)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '8.15.5'

      - name: Install dependencies
        working-directory: packages/backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Check first Sunday of month
        id: check_date
        run: |
          day=$(date -u +%d)
          if [ "$day" -gt 7 ]; then
            echo "Not the first Sunday of the month (day-of-month=$day) -- skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run EstateSale.com Scraper
        if: steps.check_date.outputs.skip != 'true'
        continue-on-error: true
        id: run_scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapeEstateSaleCom } from "./src/services/scraper/sources/estateSaleComScraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => {
              try {
                const rateLimiter = new RateLimiter({ requestsPerSecond: 0.09 });
                const stats = await scrapeEstateSaleCom("national", "", rateLimiter);
                console.log("EstateSaleCom scraper completed:", JSON.stringify(stats));
                process.exit(0);
              } catch (err) {
                console.error("EstateSaleCom scraper failed:", err);
                process.exit(1);
              }
            })();
          '

      - name: Notify on failure
        if: steps.run_scraper.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            console.error('EstateSale.com scraper trigger failed')
