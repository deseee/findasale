name: OSM Overpass Business Directory Scraper

on:
  schedule:
    # Weekly on Sunday at 05:00 UTC — focuses on flea markets, swap meets, and outdoor markets
    # (most volatile category). Rotate full 100 metros each week.
    - cron: '0 5 * * 0'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Overpass timeout is 30s per query; 100 metros should complete in 60 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run OSM Overpass directory scraper
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-osm-overpass.ts
