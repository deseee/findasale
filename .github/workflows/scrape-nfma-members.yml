name: Scrape NFMA Member Markets (Playwright)

on:
  workflow_dispatch:  # PARKED S960 — Wix site not Playwright-accessible; re-enable if source changes

jobs:
  scrape:
    name: NFMA Member Directory Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('Fix: GitHub repo -> Settings -> Secrets -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium
        working-directory: packages/backend

      - name: Run NFMA Member Directory Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runNFMAMembersScraper } from "./src/services/scraper/sources/nfmaMembersScraper";
            (async () => { try {
              await runNFMAMembersScraper();
              console.log("NFMA Members scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("NFMA Members scraper failed:", err);
              process.exit(1);
            }
            })();
          '
