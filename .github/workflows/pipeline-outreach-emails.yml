# cache-bust: 2026-06-10 (force cron scheduler re-registration after S939 re-enable)
name: Pipeline — Outreach Emails
on:
  schedule:
    - cron: '0 8 * * *'   # 1x/day while outreach paused (cap=1); was every-4h/6x — cuts Actions minutes
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger outreach-emails job
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"job":"outreach-emails"}' \
            "${RAILWAY_BACKEND_URL}/api/internal/jobs/run" \
            --fail-with-body --connect-timeout 10 --max-time 60
