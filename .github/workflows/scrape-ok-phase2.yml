name: Scrape Oklahoma Pawnbroker Licenses (Phase 2)

on:
  schedule:
    # Monday 6:00 AM UTC (5:45 + 15min stagger)
    - cron: '5 6 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Oklahoma Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database
      - name: Run Oklahoma Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runOklahomaphase2Scraper } from "./src/services/scraper/sources/oklahomaphase2Scraper";
            (async () => { try {
              await runOklahomaphase2Scraper();
              console.log("Oklahoma Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Oklahoma Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Oklahoma Phase 2 pawnbroker scraper failed. Check workflow logs.'
            })
