name: Scrape PublicSurplus Government Auction Directory

on:
  schedule:
    # Fixed 2026-07-26: day-of-month '1-7' + day-of-week '2' were both
    # restricted, which POSIX/GitHub Actions cron treats as OR'd (fires if
    # EITHER matches), not AND'd -- month is unrestricted here, so this was
    # firing every day 1-7 of every month AND every Tuesday of every month,
    # a union of both -- confirmed via 10 real runs averaging every ~7-9
    # days (Jun16, Jun23, Jul2, Jul3, Jul4, Jul5, Jul6, Jul7, Jul14, Jul21),
    # each a real ~3+ hour scrape, instead of the intended 1x/month. Fix:
    # unrestrict day-of-month here and gate the real "first Tuesday" check
    # in the step below.
    - cron: '0 8 * * 2'  # Every Tuesday; step below skips all but the first Tuesday of the month
  workflow_dispatch:

jobs:
  scrape:
    name: PublicSurplus Government Agencies Scraper (All Categories)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Check first Tuesday of month
        id: check_date
        run: |
          day=$(date -u +%d)
          if [ "$day" -gt 7 ]; then
            echo "Not the first Tuesday of the month (day-of-month=$day) -- skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PublicSurplus Scraper
        if: steps.check_date.outputs.skip != 'true'
        continue-on-error: true
        id: run_scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapePublicSurplus } from "./src/services/scraper/sources/publicSurplusScraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.5 });
              const stats = await scrapePublicSurplus("national", "", rateLimiter);
              console.log("PublicSurplus scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("PublicSurplus scraper failed:", err);
              process.exit(1);
            }
            })();
          '

      - name: Notify on failure
        if: steps.run_scraper.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            console.error('PublicSurplus scraper trigger failed')
