name: Scrape Arkansas Secondary Sale Registry (Phase 2)

on:
  schedule:
    # Monday 12:15 PM UTC (staggered from other Phase 2 scrapers)
    - cron: '15 12 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Arkansas Phase 2 Secondary Sale Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run Arkansas Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runArkansasPhase2Scraper } from "./src/services/scraper/sources/arkansasPhase2Scraper";
            (async () => { try {
              await runArkansasPhase2Scraper();
              console.log("Arkansas Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Arkansas Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
