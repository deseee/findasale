name: Scrape Foursquare Places

on:
  schedule:
    - cron: '0 3 3 * *'   # 3rd of month
    - cron: '0 3 4 * *'   # 4th of month
  # Sandbox plan: 9,450 free calls remaining, no card on file — cannot be billed.
  # Actual usage: ~550 calls/cycle (390 + 160 confirmed May 2026). Re-enabled S695.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Foursquare scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-foursquare-places.ts
