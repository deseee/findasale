name: Scrape Foursquare Places

on:
  # DISABLED S695 — Foursquare free tier drops to 500 calls/month on June 1 2026.
  # Our volume: ~2,461 requests/run × 2 runs/month = ~4,922/month → WILL BILL post June 1.
  # Re-enable only if free tier is restored or volume is reduced below 500/month.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Foursquare scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-foursquare-places.ts
