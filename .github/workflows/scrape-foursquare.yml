name: Scrape Foursquare Places

on:
  schedule:
    - cron: '0 3 3 * *'   # 3rd of month - batch 1 (metros 0-49)
    - cron: '0 3 4 * *'   # 4th of month - batch 2 (metros 50-99)
  workflow_dispatch:
    inputs:
      metro_batch:
        description: 'Metro batch (1=first 50, 2=second 50, empty=all)'
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Foursquare scraper
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          METRO_BATCH: ${{ github.event.inputs.metro_batch || (github.event.schedule == '0 3 3 * *' && '1') || (github.event.schedule == '0 3 4 * *' && '2') || '' }}
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-foursquare-places.ts
