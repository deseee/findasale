name: Backfill Organizer Contact Data

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 7am UTC (1 hour after AI enrichment job)
  workflow_dispatch:

concurrency:
  group: backfill-organizer-contacts
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger organizer contact backfill
        run: |
          echo "Triggering organizer contact backfill..."
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "x-internal-secret: ${{ secrets.OUTREACH_SECRET }}" \
            -d '{}' \
            ${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/backfill-organizer-contacts

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('Organizer contact backfill workflow failed');
