name: Backfill Organizer Contact Data

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 7am UTC (1 hour after AI enrichment job)
  workflow_dispatch:

concurrency:
  group: backfill-organizer-contacts
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger organizer contact backfill
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          echo "Triggering organizer contact backfill..."
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${RAILWAY_BACKEND_URL}/api/internal/backfill-organizer-contacts" \
            --fail-with-body --connect-timeout 10 --max-time 120

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('Organizer contact backfill workflow failed');
