name: Playwright Harness Smoke Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test (default: fleamarkets.org NFMA members)'
        required: false
        default: 'https://www.fleamarkets.org/nfma-member-markets'
      selector:
        description: 'CSS selector to wait for (optional)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium
        working-directory: packages/backend

      - name: Run structure dump
        continue-on-error: true
        working-directory: packages/backend
        env:
          TEST_URL: ${{ github.event.inputs.url || 'https://www.fleamarkets.org/nfma-member-markets' }}
        run: npx tsx src/_playwright_harness.ts
