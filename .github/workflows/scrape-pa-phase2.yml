name: Scrape Pennsylvania Business Registry (Phase 2)

on:
  schedule:
    # Tuesday 8:00 AM UTC
    - cron: '5 8 * * 2'
  workflow_dispatch:

jobs:
  scrape:
    name: Pennsylvania Phase 2 Business Registry Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/database
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: Run Pennsylvania Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runPennsylvaniaPhase2Scraper } from "./src/services/scraper/sources/pennsylvaniaPhase2Scraper";
            (async () => { try {
              await runPennsylvaniaPhase2Scraper();
              console.log("Pennsylvania Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Pennsylvania Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
