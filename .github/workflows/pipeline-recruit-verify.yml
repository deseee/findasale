name: Pipeline — Recruit Verify
on:
  schedule:
    - cron: '17 12 * * *'   # daily 12:17 UTC, before the first send window; job no-ops unless RECRUIT_SEND_ENABLED=true
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger recruit-verify job
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"job":"recruit-verify"}' \
            "${RAILWAY_BACKEND_URL}/api/internal/jobs/run" \
            --fail-with-body --connect-timeout 10 --max-time 60
