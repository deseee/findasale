name: Scrape YellowPages.ca Secondary Sale Directory

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday 05:00 UTC (after Phase 2 scrapers, before scoring)
  workflow_dispatch:

jobs:
  scrape:
    name: YellowPages.ca Directory Scraper (All Canadian Provinces)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run YellowPages.ca Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          OUTREACH_CANADA_ENABLED: ${{ secrets.OUTREACH_CANADA_ENABLED }}
        run: |
          npx tsx -e '
            import { runYellowPagesCaScraper } from "./src/services/scraper/sources/yellowPagesCaScraper";
            (async () => { try {
              await runYellowPagesCaScraper();
              process.exit(0);
            } catch (err) {
              console.error("YellowPages.ca scraper failed:", err);
              process.exit(1);
            }
            })();
          '
