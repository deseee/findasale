name: Scrape California Secondhand Dealer / Pawnbroker Licenses (Phase 2)

on:
  schedule:
    # Monday 09:30 UTC — CA runs first (highest priority, large dataset)
    - cron: '30 9 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: California Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest
    # CA dataset is expected to be large (5,000–10,000 records).
    # Current scraper is in STUB MODE until a live CA DOJ endpoint is confirmed.
    # When live: per-run cap of 2,000 records with cursor pagination means multiple
    # weekly runs will be needed to ingest the full dataset initially.
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database
      - name: Run California Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runCaliforniaPhase2Scraper } from "./src/services/scraper/sources/californiaPhase2Scraper";
            (async () => { try {
              await runCaliforniaPhase2Scraper();
              console.log("California Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("California Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '