# DISABLED: Cloudflare site-wide IP block — revisit if residential proxy infrastructure added
name: Scrape AuctionZip Auctioneer Directory

on:
  workflow_dispatch:
    inputs:
      letters:
        description: 'Comma-separated letter subset to scrape (e.g. A,B,C). Leave blank for full A-Z run.'
        required: false
        default: ''

jobs:
  scrape:
    name: AuctionZip Auctioneer Directory Scraper
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check if first Monday of month
        id: date_check
        run: |
          DAY=$(date +%d)
          # First Monday must fall on days 1-7
          if [ "$DAY" -gt 7 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Not the first Monday of the month (day=$DAY). Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.date_check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.date_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        if: steps.date_check.outputs.skip != 'true'
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        if: steps.date_check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run AuctionZip Scraper
        if: steps.date_check.outputs.skip != 'true'
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          LETTERS="${{ github.event.inputs.letters }}"
          npx tsx -e "
            import { runAuctionZipScraper } from './src/services/scraper/sources/auctionZipScraper';
            const letters = '$LETTERS' ? '$LETTERS'.split(',').map(l => l.trim()).filter(Boolean) : undefined;
            try {
              await runAuctionZipScraper(letters);
              console.log('AuctionZip scraper completed successfully');
              process.exit(0);
            } catch (err) {
              console.error('AuctionZip scraper failed:', err);
              process.exit(1);
            }
          "

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ AuctionZip auctioneer directory scraper failed. Check workflow logs.'
            })
