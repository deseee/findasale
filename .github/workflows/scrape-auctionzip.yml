name: Scrape AuctionZip Auctioneer Directory

# How this works:
# GitHub Actions triggers the schedule and calls the Railway backend API.
# The Railway backend (running on a non-AWS residential-adjacent IP) makes the actual
# HTTP request to AuctionZip — bypassing Cloudflare's ASN-based bot block that
# blocks GitHub Actions runners (AWS us-east-1/us-east-2) directly.
# The endpoint returns 202 immediately and runs the scrape asynchronously.

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly — Sunday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: scrape-auctionzip
  cancel-in-progress: false

jobs:
  scrape:
    name: Trigger AuctionZip Scraper via Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger AuctionZip scrape
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          echo "Triggering AuctionZip scraper via Railway backend..."
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${RAILWAY_BACKEND_URL}/api/internal/scraper/run-auctionzip" \
            --fail-with-body --connect-timeout 10 --max-time 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('AuctionZip scraper trigger failed')
