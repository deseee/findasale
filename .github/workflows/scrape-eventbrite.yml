name: Eventbrite Scraper

# DEPRECATED: Eventbrite /v3/events/search/ requires app approval, not available on free API keys.
# Re-enable when/if Eventbrite grants search access.
on:
  workflow_dispatch:     # Manual trigger only — cron disabled

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Eventbrite scraper
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
          EVENTBRITE_ORGANIZER_ID: ${{ secrets.EVENTBRITE_ORGANIZER_ID }}
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-eventbrite.ts
