name: Scrape NAA Find an Auctioneer Directory

# RE-ARMED 2026-08-08: same root cause already diagnosed and fixed for
# scrape-propertyroom.yml (see that file's "RE-ARMED 2026-07-05" comment) --
# a GitHub Actions billing block on 2026-06-24 (payments failed / spending
# limit) can silently kill a cron-only workflow's schedule registration even
# after billing is fixed, and the schedule never fires again on its own until
# the workflow file is touched. This workflow had zero recorded runs since
# 2026-07-01 despite its cron covering that date (confirmed via STATE.md's
# scheduler-gap audit: "zero run record at all for 2026-07-01 -- not failed,
# simply absent, no red X ever fired"). This comment is that re-arming touch,
# which forces GitHub to re-register the trigger. If it goes silent again
# after a future billing incident, repeat this (touch any line in this file).
# SCHEDULE DISABLED 2026-10-30 (next run would have been 2026-11-01 08:00 UTC).
# The Novi AMS list endpoint this scraper posts to,
# members.auctioneers.org/members/directory-customer-list, now answers 404 while the
# landing page members.auctioneers.org/find-an-auctioneer still answers 200. The landing
# page renders no members in its HTML ("Loading..." until a script fills it) and says
# "More results may be available to logged in members"; Novi documents "technical
# safeguards in place to help protect against robo-scrapers" on its directories. No
# replacement public list endpoint could be identified, so a monthly run can only fail.
# Checked 2026-10-30: robots.txt does not disallow /find-an-auctioneer (only /api/,
# /novi-api/, /admin/, /login...; Crawl-delay 1 for ClaudeBot), and
# www.auctioneers.org/legal/ has no scraping clause. sitemap.xml does list individual
# public profiles (/find-an-auctioneer/<slug>, lastmod 2025-09-19) which a profile-page
# parser could use instead -- not built yet. The 1,944 NAA organizers already ingested
# (last created 2026-09-01) are unaffected.
# SCHEDULE RE-ENABLED 2026-11-01 for the NEW PATH ONLY: the job below now runs
# scrapeNAAProfiles (packages/backend/src/services/scraper/sources/naaProfileScraper.ts),
# which never calls the dead list endpoint. It reads robots.txt (re-checked every run; a
# disallow or an unreadable robots.txt stops it), then sitemap.xml, then at most 150 public
# profile pages (/find-an-auctioneer/<slug>) one at a time, 3 s apart (3x the crawl-delay),
# with a FindASaleBot user agent. Each weekly run takes the next slice of the sitemap, so
# all ~400 profiles are covered in three weeks. Re-checked 2026-11-01: robots.txt still
# allows /find-an-auctioneer/, members.auctioneers.org/legal and www.auctioneers.org/legal
# have no scraping/automated-access clause. Only public fields are kept (name, the member's
# own city/state, the member's website); the profile's Contact phone/address is NAA's own
# office and is never stored, and email is behind NAA's contact form.
on:
  schedule:
    - cron: '23 8 * * 1'  # Mondays 08:23 UTC: next ~150-profile slice of the sitemap
  workflow_dispatch:

jobs:
  scrape:
    name: NAA Find an Auctioneer Profile Scraper (National)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} -- {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Run NAA Profile Scraper (sitemap-driven)
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NAA_PROFILE_CAP_PER_RUN: '150'
          NAA_PROFILE_INTERVAL_MS: '3000'
        run: |
          npx tsx -e '
            import { scrapeNAAProfiles } from "./src/services/scraper/sources/naaProfileScraper";
            (async () => { try {
              const stats = await scrapeNAAProfiles("national", "");
              console.log("NAA scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("NAA scraper failed:", err);
              process.exit(1);
            }
            })();
          '
