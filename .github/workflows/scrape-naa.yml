name: Scrape NAA Find an Auctioneer Directory

on:
  # schedule DISABLED — BROKEN — NAA directory is JavaScript-rendered (Novi AMS platform).
  # Static HTTP fetch returns a "Loading..." placeholder with no member data.
  # The site also requires a logged-in member session for full results.
  # To fix: implement Playwright/Puppeteer headless rendering with auth session cookies,
  # or use the Novi AMS API if NAA exposes one. Plain fetch cannot retrieve member cards.
  # Verified broken: 2026-05-23 — web_fetch returned zero member cards in HTML.
  # was: cron: '0 15 1 * *'
  workflow_dispatch:

jobs:
  scrape:
    name: NAA Find an Auctioneer Directory Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run NAA Directory Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapeNAADirectory } from "./src/services/scraper/sources/naaAuctioneerDirectory";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.5 });
              const stats = await scrapeNAADirectory("national", "", rateLimiter);
              console.log("NAA scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("NAA scraper failed:", err);
              process.exit(1);
            }
            })();
          '
