name: Scrape GarageSaleFinder

# RETIRED 2026-07-05: GarageSaleFinder is scraped daily by the backend's own
# internal cron (scraperCron.ts, 06:00 UTC) via Railway env var
# USE_GH_ACTIONS_GARAGESALEFINDER=false. This workflow's weekly schedule was
# dead since 2026-06-24 (GitHub Actions billing block that day, confirmed via
# the failed run's annotation) and never resumed — investigation confirmed via
# direct DB query that GarageSaleFinder data flowed fine the entire time via
# the backend cron, so this workflow was pure redundant monitoring noise.
# Automatic schedule removed; kept as workflow_dispatch only for a manual
# one-off run if ever needed.

on:
  workflow_dispatch:
    inputs:
      metro:
        description: 'Metro area (e.g., grand-rapids-mi, detroit-mi, chicago-il)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GarageSaleFinder Scraper
        run: |
          if [ -z "${{ github.event.inputs.metro }}" ]; then
            echo "Scraping GarageSaleFinder for all national metros (DEFAULT_METROS)"
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "x-internal-secret: ${{ secrets.OUTREACH_SECRET }}" \
              -d '{}' \
              ${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/scraper/run-garagesalefinder
          else
            echo "Scraping GarageSaleFinder for: ${{ github.event.inputs.metro }}"
            curl -X POST \
              -H "Content-Type: application/json" \
              -H "x-internal-secret: ${{ secrets.OUTREACH_SECRET }}" \
              -d "{\"metros\":[\"${{ github.event.inputs.metro }}\"]}" \
              ${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/scraper/run-garagesalefinder
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('GarageSaleFinder scraper workflow failed');
