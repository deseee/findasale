name: Scrape Facebook Marketplace

# How this works:
# GitHub Actions triggers the schedule and calls the Railway backend API.
# The Railway backend (running on a non-Azure IP) makes the actual HTTP request to
# Facebook's GraphQL endpoint — bypassing the ASN-based block that silently returned
# HTML error pages to GitHub Actions runners (AWS us-east-1/us-east-2).
# The endpoint returns 202 immediately and runs the scrape asynchronously.
# See roadmap #380.

on:
  schedule:
    - cron: '17 4 * * 2'  # Tuesdays at 04:17 UTC (offset from :00 -- 5-workflow cluster at 4:00 was likely causing GitHub's scheduler to silently drop this low-frequency cron; missed 2026-06-30 and 2026-07-07 ticks)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Trigger Facebook Marketplace Scraper via Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Facebook Marketplace scrape
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          echo "Triggering Facebook Marketplace scraper via Railway backend..."
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${RAILWAY_BACKEND_URL}/api/internal/scraper/run-facebook-marketplace" \
            --fail-with-body --connect-timeout 10 --max-time 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('Facebook Marketplace scraper trigger failed');
