name: Scrape Facebook Marketplace

on:
  schedule:
    - cron: '0 3 * * 6'  # Saturday 3:00 UTC — weekly (Saturday is otherwise clear)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 43 metros × 3 queries × jitter ≈ 45–75 min worst case

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Facebook Marketplace scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FB_MARKETPLACE_ORGANIZER_ID: ${{ secrets.FB_MARKETPLACE_ORGANIZER_ID }}
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-facebook-marketplace.ts
