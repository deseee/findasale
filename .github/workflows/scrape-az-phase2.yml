name: Scrape Arizona Pawnbroker Licenses (Phase 2)

on:
  schedule:
    # Monday 7:00 AM UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Arizona Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database
      - name: Run Arizona Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runArizonaPhase2Scraper } from "./src/services/scraper/sources/arizonaPhase2Scraper";
            (async () => { try {
              await runArizonaPhase2Scraper();
              console.log("Arizona Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Arizona Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '