name: Scrape Licenses & Registries (Phase 2 Batch)

# Consolidated runner for all ~51 state license/registry Phase 2 scrapers.
# Replaces 51 individual workflows that each paid their own pnpm-install +
# prisma-generate setup and rounded up to a billed minute every Monday.
#
# STALE-COMMENT FIX 2026-08-08: this header used to read "trigger is
# workflow_dispatch ONLY during verification ... A schedule is added (and the
# originals' crons disabled) only AFTER this batch is proven ..." while the
# `on:` block below already had `schedule:` active -- read at face value that
# looked like the schedule had been turned on prematurely, before the
# promised verification. Checked directly, not assumed: (1) all 51 individual
# per-state scrape-*-phase2.yml workflows already have their `schedule:`
# blocks removed (confirmed by reading every file's `on:` block -- each now
# has `workflow_dispatch:` only, several explicitly commented "schedule
# DISABLED"), so there is no double-run risk against this batch; (2)
# claude_docs/session-log-archive.md records "batched 51 individual phase2
# license-scraper workflows into ONE weekly workflow ... retired 42
# individual crons, 9 already stub-disabled ... Batch verified: 48/51 pass"
# from the real verification run that happened BEFORE the schedule below was
# added and the 51 originals' crons were retired. So the schedule promotion
# was correct and the process this comment describes was actually followed --
# the comment itself was simply never updated afterward to say so. Left here
# as the historical record of that process; it is DONE, not pending.

# RED/GREEN SEMANTICS (changed 2026-08-16, roadmap #558):
# This job no longer fails when a single state scraper fails. Across 51
# independent third-party government/open-data sites, at least one being down on
# any given Monday is normal -- the old all-or-nothing exit made a green run
# structurally unachievable (8 runs, 0 green, while 48-49 of 51 scrapers passed).
# Now: runLicenseScrapersBatch.ts reports every scraper's status, item count and
# duration in the job summary, emits a ::warning:: annotation per failed or
# zero-record scraper, and exits non-zero ONLY when the failure RATE exceeds
# MAX_FAILURE_RATE (20%) -- the signature of a systemic break (bad DATABASE_URL,
# Prisma client mismatch, blocked egress, shared-helper regression) rather than
# unrelated site outages. A RED run here therefore means "something is broken on
# our side"; individual state failures are read from the job summary table.

on:
  schedule:
    - cron: '0 5 * * 1'   # weekly Monday — replaces the 51 individual phase2 scrapers
  workflow_dispatch:

jobs:
  scrape:
    name: License & Registry Phase 2 Batch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} - {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Run License & Registry Phase 2 Batch
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx src/scripts/runLicenseScrapersBatch.ts
