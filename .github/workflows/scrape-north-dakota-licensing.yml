name: Scrape North Dakota Auctioneer Licenses

on:
  schedule:
    - cron: '0 9 * * 3'   # Wednesday 9am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run North Dakota Licensing Scraper
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            "${RAILWAY_BACKEND_URL}/api/internal/scraper/run-north-dakota-licensing" \
            --fail-with-body \
            --connect-timeout 10 \
            --max-time 3600
