name: EstateSalesNet Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC
  workflow_dispatch:
    inputs:
      chunk:
        description: 'Run a single chunk only (1-4). Leave blank to run all chunks.'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Note: no `concurrency:` block — matrix already runs all 4 chunks in
    # parallel, and GH's default behavior is to NOT cancel in-progress runs
    # when a new run is triggered. Adding a per-chunk concurrency group caused
    # chunks 2–4 to serialize behind chunk 1 (S715: chunk 1 finished, 2–4 hung).

    strategy:
      fail-fast: false   # One chunk failure does not cancel the others
      matrix:
        chunk: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version auto-detected from root package.json "packageManager" field
        # (pnpm@8.15.5). v4 errors if both are set — keep package.json as source of truth.

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run EstateSalesNet scraper (chunk ${{ matrix.chunk }}/4)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
          SCRAPER_CHUNK: ${{ matrix.chunk }}
          SCRAPER_TOTAL_CHUNKS: '4'
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-estatesalesnet.ts
