name: Scrape Pennsylvania Auctioneer Licenses

on:
  schedule:
    - cron: '0 7 * * 4'
  workflow_dispatch:

concurrency:
  group: scrape-pennsylvania-licensing
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Pennsylvania licensing scraper
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            "${RAILWAY_BACKEND_URL}/api/internal/scraper/run-pennsylvania-licensing" \
            --fail-with-body \
            --connect-timeout 10 \
            --max-time 3600
