name: Scrape AuctionNinja Estate Sale Company Directory

on:
  schedule:
    # 1st of each month at 14:00 UTC
    - cron: '0 14 1 * *'
  workflow_dispatch:

jobs:
  scrape:
    name: AuctionNinja Directory Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run AuctionNinja Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapeAuctionNinja } from "./src/services/scraper/sources/auctionNinjaScraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const { DEFAULT_METROS } = await import("./src/services/scraper/sources/saleSeeker");
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.3 });
              let totalCreated = 0;
              for (const metro of DEFAULT_METROS) {
                const stats = await scrapeAuctionNinja(metro, "", rateLimiter);
                totalCreated += stats.itemsCreated;
              }
              console.log("AuctionNinja scraper completed. Total created:", totalCreated);
              process.exit(0);
            } catch (err) {
              console.error("AuctionNinja scraper failed:", err);
              process.exit(1);
            }
            })();
          '
