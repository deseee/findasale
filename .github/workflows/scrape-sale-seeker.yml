name: Scrape Sale Seeker

on:
  schedule:
    # Every Monday at 5:00 AM UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      metro:
        description: 'Metro area (e.g., grand-rapids-mi, detroit-mi, chicago-il)'
        required: false
        default: 'grand-rapids-mi'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Sale Seeker Scraper
        run: |
          METRO="${{ github.event.inputs.metro || 'grand-rapids-mi' }}"
          echo "Scraping Sale Seeker for: $METRO"
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "x-internal-secret: ${{ secrets.OUTREACH_SECRET }}" \
            -d "{\"metro\":\"$METRO\"}" \
            ${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/scraper/run-sale-seeker

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('Sale Seeker scraper workflow failed');
