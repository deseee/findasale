name: Newspaper RSS Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC — 2 hours after Craigslist (00:30) to stagger backend load
  workflow_dispatch:       # Manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # RSS feeds are fast — 20 min is generous

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Newspaper RSS scraper
        env:
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
          RSS_ORGANIZER_ID: ${{ secrets.RSS_ORGANIZER_ID }}
        run: |
          cd packages/backend
          ./node_modules/.bin/ts-node src/scripts/run-newspaper-rss.ts
