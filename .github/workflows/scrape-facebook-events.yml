name: Facebook Events Search Scraper

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily (full ~301-metro list sharded across 7 days)
  workflow_dispatch:
    inputs:
      all_metros:
        description: 'Run ALL ~301 metros this run (full backfill — ignores daily sharding)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 30 raised to 60: proxy page-fetch enrichment adds ~15-20 min overhead

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Run Facebook Events search scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          INTERNAL_SCRAPER_KEY: ${{ secrets.INTERNAL_SCRAPER_KEY }}
          SEARLO_API_KEY: ${{ secrets.SEARLO_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCALESERP_API_KEY: ${{ secrets.SCALESERP_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FB_EVENTS_ORGANIZER_ID: ${{ secrets.FB_EVENTS_ORGANIZER_ID }}
          # Searlo per-minute rate cap (repo Variable, not a secret). Empty is fine —
          # the scraper defaults to 9 (free tier = 10/min, 9 leaves margin). When the
          # Searlo plan is upgraded, set the SEARLO_RPM repo Variable to the new limit;
          # no code change is needed.
          SEARLO_RPM: ${{ vars.SEARLO_RPM }}
          # Manual workflow_dispatch with all_metros=true bypasses daily sharding and
          # runs the entire ~301-metro list (full backfill). Scheduled runs leave this
          # unset, so the scraper runs only today's ~43-metro shard.
          FB_EVENTS_ALL_METROS: ${{ inputs.all_metros }}
          # ADR-081: direct page-fetch enrichment kill-switch. Repo Variable
          # (not secret) — default unset/false runs pure-SERP behavior identical
          # to pre-ADR-081. Set to 'true' only after a manual workflow_dispatch
          # test run confirms real dates are being captured.
          FB_EVENTS_DIRECT_FETCH_ENABLED: ${{ vars.FB_EVENTS_DIRECT_FETCH_ENABLED }}
          # ADR-081 proxy: Cloudflare Worker routes page-fetches through AS13335,
          # bypassing Facebook datacenter-IP block on GH Actions egress IPs.
          # FB_EVENTS_PROXY_URL is a repo Variable; FB_EVENTS_PROXY_TOKEN is a repo Secret.
          FB_EVENTS_PROXY_URL: ${{ vars.FB_EVENTS_PROXY_URL }}
          FB_EVENTS_PROXY_TOKEN: ${{ secrets.FB_EVENTS_PROXY_TOKEN }}
          # ADR-082: self-hosted discovery via FB's own events/search through the
          # proxy (structured start_timestamp/address, no paid SERP). Repo Variable —
          # 'true' activates proxy discovery; unset/false keeps the SERP path.
          FB_EVENTS_DISCOVERY_VIA_PROXY: ${{ vars.FB_EVENTS_DISCOVERY_VIA_PROXY }}
          # ADR-082 Option A: per-event street-address enrichment in the proxy
          # discovery path (second pass fetches each unique event page for its real
          # street address; run-global cap + 10-min budget). Repo Variable — 'true'
          # activates enrichment; unset/false is a no-op. Only meaningful when
          # FB_EVENTS_DISCOVERY_VIA_PROXY is also 'true'. Requires FB_EVENTS_PROXY_URL
          # to be the BARE worker origin (S1114) or the /fb-event-page fetch 404s.
          FB_EVENTS_ADDRESS_FETCH: ${{ vars.FB_EVENTS_ADDRESS_FETCH }}
        run: |
          cd packages/backend
          npx ts-node src/scripts/run-search-facebook-events.ts
