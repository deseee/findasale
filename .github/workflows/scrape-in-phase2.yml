name: Scrape Indiana Secondary Sale Licenses (Phase 2)

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Indiana Phase 2 Secondary Sale Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run Indiana Phase 2 Scraper
        continue-on-error: true
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runIndianaPhase2Scraper } from "./src/services/scraper/sources/indianaPhase2Scraper";
            (async () => { try {
              await runIndianaPhase2Scraper();
              console.log("Indiana Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Indiana Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
