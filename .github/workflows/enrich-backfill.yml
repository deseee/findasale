name: Enrichment Backfill
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Re-enrich ALL organizers (true) or unenriched-only (false)'
        required: false
        default: 'false'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger enrichment backfill on Railway
        run: |
          URL="${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/scraper/enrich-backfill"
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            URL="${URL}?all=true"
          fi
          curl -X POST \
            -H "x-scraper-key: ${{ secrets.INTERNAL_SCRAPER_KEY }}" \
            -H "Content-Type: application/json" \
            "$URL"
