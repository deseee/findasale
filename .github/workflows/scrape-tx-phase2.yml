name: Scrape Texas TDLR All Licenses (Phase 2)

on:
  schedule:
    # Monday 8:30 AM UTC
    - cron: '30 8 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Texas Phase 2 TDLR Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Texas Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runTexasPhase2Scraper } from "./src/services/scraper/sources/texasPhase2Scraper";
            try {
              await runTexasPhase2Scraper();
              console.log("Texas Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Texas Phase 2 scraper failed:", err);
              process.exit(1);
            }
          '

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Texas Phase 2 TDLR scraper failed. Check workflow logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
