name: Scrape Texas TDLR All Licenses (Phase 2)

on:
  schedule:
    # Monday 8:30 AM UTC
    - cron: '35 8 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Texas Phase 2 TDLR Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/database
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: Run Texas Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runTexasPhase2Scraper } from "./src/services/scraper/sources/texasPhase2Scraper";
            (async () => { try {
              await runTexasPhase2Scraper();
              console.log("Texas Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Texas Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
