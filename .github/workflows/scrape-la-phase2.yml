name: Scrape Louisiana Secondary Sale Business Licenses (Phase 2)

on:
  schedule:
    # Monday 1:30 PM UTC
    - cron: '30 13 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Louisiana Phase 2 Secondary Sale Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run Louisiana Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runLouisianaPhase2Scraper } from "./src/services/scraper/sources/louisianaPhase2Scraper";
            (async () => { try {
              await runLouisianaPhase2Scraper();
              console.log("Louisiana Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Louisiana Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
