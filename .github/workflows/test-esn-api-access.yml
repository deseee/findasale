name: Test ESN API Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe estatesales.net /api/sale-details from datacenter
        run: |
          set -e
          URL="https://www.estatesales.net/api/sale-details?bypass=bycoordinatesanddistance:42.96336_-85.668086_50&include=saleschedule&select=id,name,orgName,cityName,stateCode,postalCodeNumber,latitude,longitude,address,type,firstUtcStartDate,lastUtcEndDate,saleSchedule&explicitTypes=DateTime"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          echo "==> GET $URL"
          STATUS=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "User-Agent: $UA" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://www.estatesales.net/MI/Grand-Rapids" \
            "$URL")
          BYTES=$(wc -c < /tmp/body)
          echo "==> HTTP $STATUS | $BYTES bytes"
          echo ""
          echo "==> First 600 chars of response:"
          head -c 600 /tmp/body
          echo ""
          echo ""

          if grep -qi "request has been blocked" /tmp/body; then
            echo "==> VERDICT: ❌ WAF BLOCKED (API also gated)"
            exit 1
          elif [ "$STATUS" = "200" ] && grep -q '"id"' /tmp/body && grep -q '"latitude"' /tmp/body; then
            COUNT=$(grep -o '"id":' /tmp/body | wc -l)
            echo "==> VERDICT: ✅ API ACCESSIBLE FROM DATACENTER — $COUNT records returned"
            exit 0
          else
            echo "==> VERDICT: ⚠️  Unknown — got HTTP $STATUS but content doesn't match expected JSON"
            exit 2
          fi
