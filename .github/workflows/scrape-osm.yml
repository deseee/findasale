name: Scrape OSM Overpass API

on:
  schedule:
    # Fixed 2026-07-26: day-of-month '1-7' + day-of-week '1' were both
    # restricted, which POSIX/GitHub Actions cron treats as OR'd (fires if
    # EITHER matches), not AND'd -- this was firing every Monday within the
    # trigger months instead of only the first. Root cause of the ambiguous
    # cron: commit 7b67eb88 (2026-07-15, unrelated 'Harden Anthropic-balance
    # failure paths' commit) silently changed this from a correct plain-
    # weekly '5 3 * * 1' to this broken quarterly-intended expression as an
    # apparent drive-by edit. It was masked through July (a trigger month,
    # so it kept firing weekly by coincidence) but would have gone dark for
    # August+September and resumed in October. Fix: unrestrict day-of-month
    # here and gate the real "first Monday" check in the step below.
    - cron: '5 3 * 1,4,7,10 1'   # Every Monday in Jan/Apr/Jul/Oct; step below skips all but the first
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        batch_index: [0, 1, 2, 3, 4, 5]
      fail-fast: false  # one batch failing shouldn't cancel others

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --filter backend --filter database

      - name: Generate Prisma client
        run: cd packages/database && npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Check first Monday of month
        id: check_date
        run: |
          day=$(date -u +%d)
          if [ "$day" -gt 7 ]; then
            echo "Not the first Monday of the month (day-of-month=$day) -- skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OSM Overpass scraper batch ${{ matrix.batch_index }}
        if: steps.check_date.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_BATCH_INDEX: ${{ matrix.batch_index }}
          SCRAPER_BATCH_COUNT: 6
        run: |
          sleep $(( ${{ matrix.batch_index }} * 30 ))
          cd packages/backend
          npx tsx src/scripts/run-osm.ts
