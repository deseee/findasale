name: Enrich AI Listing Metadata

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

concurrency:
  group: enrich-ai-metadata
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger enrichment batch
        env:
          OUTREACH_SECRET: ${{ secrets.INTERNAL_API_TOKEN }}
          RAILWAY_BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
        run: |
          echo "Triggering AI listing enrichment batch..."
          curl -X POST \
            -H "x-internal-secret: ${OUTREACH_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${RAILWAY_BACKEND_URL}/api/internal/enrich-listing-metadata" \
            --fail-with-body --connect-timeout 10 --max-time 120

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('AI listing enrichment workflow failed');
