name: Enrich AI Listing Metadata

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

concurrency:
  group: enrich-ai-metadata
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger enrichment batch
        run: |
          curl -s -X POST \
            -H "x-internal-secret: ${{ secrets.INTERNAL_SECRET }}" \
            -H "Content-Type: application/json" \
            https://backend-production-153c9.up.railway.app/api/internal/enrich-listing-metadata
