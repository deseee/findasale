name: Enrich AI Listing Metadata

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

concurrency:
  group: enrich-ai-metadata
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger enrichment batch
        run: |
          echo "Triggering AI listing enrichment batch..."
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "x-internal-secret: ${{ secrets.OUTREACH_SECRET }}" \
            -d '{}' \
            ${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/enrich-listing-metadata

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            console.error('AI listing enrichment workflow failed');
