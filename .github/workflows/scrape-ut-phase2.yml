name: Scrape Utah Pawnbroker Licenses (Phase 2)

on:
  schedule:
    # Monday 12:00 PM UTC
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Utah Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Utah Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runUtahPhase2Scraper } from "./src/services/scraper/sources/utahPhase2Scraper";
            (async () => { try {
              await runUtahPhase2Scraper();
              console.log("Utah Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Utah Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '