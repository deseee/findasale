name: Scrape Invaluable Auction House Directory

on:
  schedule:
    - cron: '0 7 * * 0'  # Sundays at 07:00 UTC (weekly — national directory, ~82 pages)
  workflow_dispatch:

jobs:
  scrape:
    name: Invaluable Auction House Directory Scraper (US, ~8,158 houses)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run Invaluable Scraper
        continue-on-error: true
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapeInvaluable } from "./src/services/scraper/sources/invaluableAuctionHouseScraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.5 });
              const stats = await scrapeInvaluable("national", "", rateLimiter);
              console.log("Invaluable scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("Invaluable scraper failed:", err);
              process.exit(1);
            }
            })();
          '
