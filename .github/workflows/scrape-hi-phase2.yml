name: Scrape Hawaii Pawnbroker Licenses (Phase 2)

on:
  schedule:
    # Monday 10:30 UTC
    - cron: '30 10 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Hawaii Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'


      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Hawaii Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runHawaiiPhase2Scraper } from "./src/services/scraper/sources/hawaiiPhase2Scraper";
            (async () => { try {
              await runHawaiiPhase2Scraper();
              console.log("Hawaii Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Hawaii Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '