name: Geocode Ungeocoded Sales

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Sales per batch (max 500, default 200)'
        required: false
        default: '200'
      source:
        description: 'Filter by sourceName (leave empty for all ungeocoded: GarageSaleFinder + FacebookEvents)'
        required: false
        default: ''
  schedule:
    # Run nightly at 2 AM UTC — after GarageSaleFinder scrape (6 AM UTC) has populated new records
    # and well before the geocodingAuditJob runs (6 AM UTC next day)
    - cron: '0 2 * * *'

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max — 500 sales × 1.1s/req ≈ 9 min per batch; multiple batches possible

    steps:
      - name: Fetch batch of ungeocoded sales
        id: fetch
        run: |
          SOURCE_PARAM=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            SOURCE_PARAM="&source=${{ github.event.inputs.source }}"
          fi

          curl -s -f \
            -H "x-scraper-key: ${{ secrets.INTERNAL_SCRAPER_KEY }}" \
            "${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/geocode-ungeocoded-sales/batch?limit=${{ github.event.inputs.batch_size || 200 }}&offset=0${SOURCE_PARAM}" \
            -o /tmp/ungeocoded_sales.json

          SALE_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/ungeocoded_sales.json')); print(len(d['sales']))")
          TOTAL=$(python3 -c "import json; d=json.load(open('/tmp/ungeocoded_sales.json')); print(d['total'])")
          echo "sale_count=${SALE_COUNT}" >> $GITHUB_OUTPUT
          echo "total_ungeocoded=${TOTAL}" >> $GITHUB_OUTPUT
          echo "Fetched ${SALE_COUNT} ungeocoded sales (${TOTAL} total pending)"

      - name: Geocode addresses via Nominatim + Census fallback
        if: steps.fetch.outputs.sale_count != '0'
        run: |
          python3 << 'EOF'
          import json
          import time
          import sys
          import urllib.request
          import urllib.parse
          import urllib.error

          USER_AGENT = 'FindA.Sale/1.0 (contact@finda.sale)'
          MIN_NOMINATIM_INTERVAL = 1.1  # seconds — Nominatim ToS: max 1 req/sec
          last_nominatim_time = 0

          def nominatim_wait():
              global last_nominatim_time
              elapsed = time.time() - last_nominatim_time
              if elapsed < MIN_NOMINATIM_INTERVAL:
                  time.sleep(MIN_NOMINATIM_INTERVAL - elapsed)
              last_nominatim_time = time.time()

          def nominatim_structured(address, city, state, zip_code):
              nominatim_wait()
              params = {
                  'street': address,
                  'city': city,
                  'state': state,
                  'country': 'us',
                  'format': 'json',
                  'limit': '1',
              }
              if zip_code:
                  params['postalcode'] = zip_code
              url = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      if data:
                          return float(data[0]['lat']), float(data[0]['lon']), 'nominatim-structured'
              except Exception as e:
                  print(f"  Nominatim structured error: {e}")
              return None, None, None

          def nominatim_freetext(full_address):
              nominatim_wait()
              params = {
                  'q': full_address,
                  'format': 'json',
                  'limit': '1',
                  'countrycodes': 'us',
              }
              url = 'https://nominatim.openstreetmap.org/search?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      if data:
                          return float(data[0]['lat']), float(data[0]['lon']), 'nominatim-freetext'
              except Exception as e:
                  print(f"  Nominatim freetext error: {e}")
              return None, None, None

          def census_geocode(address, city, state, zip_code):
              params = {
                  'street': address,
                  'city': city,
                  'state': state,
                  'benchmark': 'Public_AR_Current',
                  'format': 'json',
              }
              if zip_code:
                  params['zip'] = zip_code
              url = 'https://geocoding.geo.census.gov/geocoder/locations/address?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': USER_AGENT})
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      matches = data.get('result', {}).get('addressMatches', [])
                      if matches:
                          coords = matches[0]['coordinates']
                          return float(coords['y']), float(coords['x']), 'census'
              except Exception as e:
                  print(f"  Census error: {e}")
              return None, None, None

          with open('/tmp/ungeocoded_sales.json') as f:
              response = json.load(f)
          sales = response.get('sales', [])

          if not sales:
              print("No sales to geocode in this batch")
              sys.exit(0)

          results = []
          not_found = 0

          for i, sale in enumerate(sales):
              sale_id = sale['id']
              address = sale.get('address', '').strip()
              city = sale.get('city', '').strip()
              state = sale.get('state', '').strip()
              zip_code = (sale.get('zip') or '').strip()
              source = sale.get('sourceName', 'unknown')

              if not address or not city or not state:
                  print(f"[{i+1}/{len(sales)}] Skipping {sale_id} — missing address fields")
                  not_found += 1
                  continue

              full_address = f"{address}, {city}, {state}"
              if zip_code:
                  full_address += f" {zip_code}"

              print(f"[{i+1}/{len(sales)}] Geocoding [{source}] {full_address}")

              # Strategy 1: Nominatim structured
              lat, lng, strat = nominatim_structured(address, city, state, zip_code)

              # Strategy 2: Nominatim freetext
              if lat is None:
                  lat, lng, strat = nominatim_freetext(full_address)

              # Strategy 3: Census (no rate limit)
              if lat is None:
                  lat, lng, strat = census_geocode(address, city, state, zip_code)

              if lat is not None:
                  results.append({'id': sale_id, 'lat': lat, 'lng': lng})
                  print(f"  -> ({lat:.6f}, {lng:.6f}) via {strat}")
              else:
                  not_found += 1
                  print(f"  -> FAILED — all strategies exhausted")

          with open('/tmp/geocoding_results.json', 'w') as f:
              json.dump({'results': results}, f)

          print(f"\nDone: {len(results)}/{len(sales)} geocoded, {not_found} not found")
          EOF

      - name: Post geocoded results to backend
        if: steps.fetch.outputs.sale_count != '0'
        run: |
          if [ ! -f /tmp/geocoding_results.json ]; then
            echo "No results file found"
            exit 0
          fi

          RESULT_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/geocoding_results.json')); print(len(d['results']))")

          if [ "$RESULT_COUNT" -eq "0" ]; then
            echo "No geocoded results to post (all addresses failed resolution)"
            exit 0
          fi

          echo "Posting ${RESULT_COUNT} geocoded results to backend..."

          curl -s -f -X POST \
            -H "Content-Type: application/json" \
            -H "x-scraper-key: ${{ secrets.INTERNAL_SCRAPER_KEY }}" \
            -d @/tmp/geocoding_results.json \
            "${{ secrets.RAILWAY_BACKEND_URL }}/api/internal/geocode-ungeocoded-sales/bulk"

          echo "Posted ${RESULT_COUNT} geocoded results"

      - name: Summary
        run: |
          echo "Total ungeocoded in DB: ${{ steps.fetch.outputs.total_ungeocoded }}"
          echo "Batch processed: ${{ steps.fetch.outputs.sale_count }}"
          if [ -f /tmp/geocoding_results.json ]; then
            GEOCODED=$(python3 -c "import json; d=json.load(open('/tmp/geocoding_results.json')); print(len(d['results']))")
            echo "Successfully geocoded: ${GEOCODED}"
          fi
