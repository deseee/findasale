name: Scrape Wyoming Pawnbroker Licenses (Phase 2)

on:
  # schedule DISABLED — BROKEN — target is JS-rendered, blocked, or dead
  # was: cron: '10 5 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: Wyoming Phase 2 Pawnbroker Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database
      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Run Wyoming Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runWyomingPhase2Scraper } from "./src/services/scraper/sources/wyomingPhase2Scraper";
            (async () => { try {
              await runWyomingPhase2Scraper();
              console.log("Wyoming Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("Wyoming Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: 1,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Wyoming Phase 2 pawnbroker scraper failed. Check workflow logs.'
            })
