name: Scrape StorageAuctions.net Directory

on:
  schedule:
    - cron: '0 9 * * 4'  # Thursdays at 09:00 UTC (weekly — avoids Tue/Wed cluster)
  workflow_dispatch:

jobs:
  scrape:
    name: StorageAuctions.net Auction Facility Scraper (National)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run StorageAuctions.net Scraper
        continue-on-error: true
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runStorageAuctionsNetScraper } from "./src/services/scraper/sources/storageAuctionsNetScraper";
            (async () => { try {
              const stats = await runStorageAuctionsNetScraper();
              console.log("StorageAuctions.net scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("StorageAuctions.net scraper failed:", err);
              process.exit(1);
            }
            })();
          '
