name: Scrape BidSpotter Auctioneers Directory

# RETIRED 2026-07-05: bidspotter.com now sits behind AWS WAF Bot Control with a
# JavaScript challenge (confirmed via direct request: response carries
# `x-amzn-waf-action: challenge` and a 1991-byte AwsWafIntegration challenge.js
# page instead of the auctioneers directory HTML). This is a NEW site-side
# change since the scraper was written (2026-06-10 notes describe a simple
# missing-header quirk, not a WAF challenge) — a static fetch/cheerio scraper
# cannot solve a JS challenge, so this workflow has been returning
# itemsFound: 0 on every run, including before the 2026-06-24 billing-block
# incident. Re-verified live 2026-07-05: still challenged, still 0 results.
# Not a code bug — the target is no longer scrapeable without a headless
# browser (Playwright/Puppeteer), which is disproportionate engineering for a
# ~35-entry static directory that rarely changes. Schedule removed; kept as
# workflow_dispatch only in case bidspotter.com's WAF config changes later —
# a manual run will immediately show whether it's still challenged.

on:
  workflow_dispatch:

jobs:
  scrape:
    name: BidSpotter Auction House Scraper (National)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Run BidSpotter Scraper
        continue-on-error: true
        id: run_scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapeBidSpotter } from "./src/services/scraper/sources/bidSpotterScraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.5 });
              const stats = await scrapeBidSpotter("national", "", rateLimiter);
              console.log("BidSpotter scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("BidSpotter scraper failed:", err);
              process.exit(1);
            }
            })();
          '

      - name: Notify on failure
        if: steps.run_scraper.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            console.error('BidSpotter scraper trigger failed')
