name: Scrape Bid13 Storage Auction Facilities

on:
  schedule:
    - cron: '0 5 1 * *'  # Monthly, 1st of month at 5:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    name: Bid13 National Storage Auction Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('Fix: GitHub repo -> Settings -> Secrets -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Run Bid13 National Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapeBid13 } from "./src/services/scraper/sources/bid13Scraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.2 });
              const stats = await scrapeBid13("national", "", rateLimiter);
              console.log("Bid13 scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("Bid13 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
