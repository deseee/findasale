name: Scrape PropertyRoom Partners Directory

# RE-ARMED 2026-07-05: schedule went silent after a GitHub Actions billing
# block on 2026-06-24 (confirmed via the failed run's own annotation: "The
# job was not started because recent account payments have failed or your
# spending limit needs to be increased"). Billing was fixed the same window,
# but this cron-only workflow's schedule never fired again on its own. This
# is a trivial touch to force GitHub to re-register the cron trigger — if it
# goes silent again after a future billing incident, repeat this.

on:
  schedule:
    - cron: '0 7 * * 3'  # Wednesdays at 7:00 UTC (weekly — partner agency list, not live auctions)
  workflow_dispatch:

jobs:
  scrape:
    name: PropertyRoom Partner Agency Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Verify database connectivity
        run: |
          python3 -c "
          import urllib.parse, socket, sys
          url = '${{ secrets.DATABASE_URL }}'
          if not url:
              print('ERROR: DATABASE_URL secret is not set')
              sys.exit(1)
          parsed = urllib.parse.urlparse(url)
          host = parsed.hostname
          port = parsed.port or 5432
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              print(f'DB connectivity OK: {host}:{port}')
          except Exception as e:
              print(f'ERROR: Cannot reach DB at {host}:{port} — {e}')
              print('ACTION REQUIRED: The DATABASE_URL GitHub Actions secret may be stale.')
              print('Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> DATABASE_URL -> Update')
              sys.exit(1)
          "

      - name: Run PropertyRoom Scraper
        continue-on-error: true
        id: run_scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapePropertyRoom } from "./src/services/scraper/sources/propertyRoomScraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.5 });
              const stats = await scrapePropertyRoom("national", "", rateLimiter);
              console.log("PropertyRoom scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("PropertyRoom scraper failed:", err);
              process.exit(1);
            }
            })();
          '

      - name: Notify on failure
        if: steps.run_scraper.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            console.error('PropertyRoom scraper trigger failed')
