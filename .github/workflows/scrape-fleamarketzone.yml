name: Scrape FleaMarketZone Directory

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 6:00 UTC (weekly — venue directory, not live events)
  workflow_dispatch:

jobs:
  scrape:
    name: FleaMarketZone Venue Directory Scraper (All US States)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (provides pnpm@8.15.5 from package.json packageManager)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run FleaMarketZone Scraper
        continue-on-error: true
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { scrapeFleaMarketZone } from "./src/services/scraper/sources/fleaMarketZoneScraper";
            import { RateLimiter } from "./src/services/scraper/rateLimiter";
            (async () => { try {
              const rateLimiter = new RateLimiter({ requestsPerSecond: 0.3 });
              const stats = await scrapeFleaMarketZone("national", "", rateLimiter);
              console.log("FleaMarketZone scraper completed:", JSON.stringify(stats));
              process.exit(0);
            } catch (err) {
              console.error("FleaMarketZone scraper failed:", err);
              process.exit(1);
            }
            })();
          '
