name: Scrape North Carolina Secondary Sale Licenses (Phase 2)

on:
  schedule:
    # Monday 6:45 AM UTC
    - cron: '45 6 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    name: North Carolina Phase 2 Scraper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run North Carolina Phase 2 Scraper
        working-directory: packages/backend
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}?connection_limit=3&pool_timeout=20"
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx -e '
            import { runNorthCarolinaPhase2Scraper } from "./src/services/scraper/sources/northCarolinaPhase2Scraper";
            (async () => { try {
              await runNorthCarolinaPhase2Scraper();
              console.log("North Carolina Phase 2 scraper completed successfully");
              process.exit(0);
            } catch (err) {
              console.error("North Carolina Phase 2 scraper failed:", err);
              process.exit(1);
            }
            })();
          '
